name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core
        run: |
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Install libraries
        run: |
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "ESP8266 and ESP32 OLED driver for SSD1306 displays"

      - name: Prepare sketch folder
        run: |
          mkdir -p sketch/GASLEAKDETECTOR
          cp src/* sketch/GASLEAKDETECTOR/

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:nodemcuv2 \
            --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json \
            --output-dir build/ \
            sketch/GASLEAKDETECTOR

      - name: Upload .bin artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: build/*.bin
